<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>入窑万彩 · 数字陶艺 DIY</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app"><div class="paper"></div><header><button id="back" aria-label="上一步">‹</button><div><button id="collection" aria-label="我的作品">♙</button><button id="share" aria-label="分享作品">➚</button></div></header><div id="posterFrame"></div><aside class="brand"><h1>入<br>窑<br><em>万<br>彩</em></h1><span class="seal">万<br>彩</span><i></i><p>入窑一色<br>出窑万彩<br>数字陶艺 DIY</p></aside><div id="scene" aria-label="可拖动塑形或旋转的三维陶瓷"></div><aside id="side"><button id="shelf"><span>☷</span>博古架</button><button id="reset"><span>⟲</span>清釉</button></aside><section id="controls"><div id="shapePanel"><h2>◈ 拉 坯 塑 形 ◈</h2><div class="row shapes"><button class="selected" data-shape="0">梅瓶</button><button data-shape="1">玉壶春</button><button data-shape="2">葫芦瓶</button><button data-shape="3">自由拉坯</button><button class="next" id="toGlaze" aria-label="选择釉色">→</button></div><p class="hint" id="shapeHint">经典器形 · 选定后上釉</p></div><div id="glazePanel" hidden><p class="hint">点击施釉 · 左右旋转 · 轻触器身晕染釉色</p><input id="hue" type="range" min="0" max="360" value="175" aria-label="釉色色相"><div class="row colors"><button data-color="0" aria-label="天青釉"></button><button data-color="1" aria-label="霁蓝釉"></button><button data-color="2" aria-label="铜红釉"></button><button data-color="3" aria-label="梅子青釉"></button><button data-color="4" aria-label="窑变釉"></button><button data-color="5" aria-label="紫金釉"></button><button class="next" id="toStamp" aria-label="落款">→</button></div></div><div id="firePanel" hidden><p class="hint">入窑一色，出窑万彩</p><button class="primary" id="fire">开启窑变</button></div><div id="firingPanel" hidden><h2 id="fireText">入 窑 ···</h2><div class="progress"><i></i></div></div></section><section id="stampPanel" hidden><div class="stampPreview">入窑万彩</div><p class="hint">底款预览</p><label for="stampInput">输入印文（1–4字）</label><input id="stampInput" maxlength="4" placeholder="入窑万彩"><label>样式选择</label><div class="row"><button class="stampStyle selected" data-style="0"><b>印</b>阴文<small>红底白字</small></button><button class="stampStyle" data-style="1"><b>印</b>阳文<small>白底红字</small></button></div><button class="primary" id="stampNext">下 一 步</button></section><section id="result" hidden><h2 id="resultTitle">窑变釉 · 梅瓶</h2><p>柴窑烧成 · 丙午年孟秋 · 孤品不可复烧</p><div class="resultSeal">万彩</div></section><footer id="resultActions" hidden><p class="hint">每一次窑变，都是独一无二的相遇</p><div class="row"><button id="save">↓<small>保存图片</small></button><button id="note">▤<small>发笔记</small></button><button id="rotate">▷<small>转瓶展示</small></button><button id="history">◷<small>回看此器</small></button><button id="again">⟳<small>再烧一件</small></button></div></footer><dialog id="gallery"><button class="close">×</button><h2>博 古 架</h2><p class="hint">收藏泥土、火与时间的相遇</p><div id="galleryItems"></div></dialog><div id="toast" role="status"></div></main><script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script><script src="app.js"></script></body></html>
